    Inputs a ler: README.md (positioning atual), código em src/ (o que o landing
    comunica hoje), PROJECT.md, este handoff, artifacts/00-management/execution-plan.md.
    Após concluir, PARAR em G1 e esperar aprovação humana antes de 02+03.

